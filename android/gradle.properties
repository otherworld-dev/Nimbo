# Project-wide Gradle settings for the Nimbo Android app.
#
# The Go core `.aar` carries a ~17 MB arm64 JNI library, so the build daemon
# gets a generous heap. AndroidX + the official Kotlin code style are required
# by the pinned dependency set; non-transitive R classes keep the generated
# R class small and unambiguous.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
